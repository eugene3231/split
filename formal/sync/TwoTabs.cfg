\* Two tabs, one phone: the cross-tab storage races. No network faults or crashes here;
\* TwoPhones.cfg checks those.
CONSTANTS
    Phones <- TTPhones
    Tabs <- TTTabs
    PhoneOf <- TTPhoneOf
    OpsOf <- TTOpsOf
    Bad = {}
    Creator = "ana"
    Created = "created"
    FriendOps <- TTFriendOps
    BatchSize = 2
    PageSize = 1
    MaxFaults = 0
    MaxCrashes = 0
    Variant = "code"

SPECIFICATION Spec

INVARIANTS
    ServerOrder
    ExactlyOnce
    ConfirmedIsPrefix
    NothingDropped
    QuietMeansConverged

