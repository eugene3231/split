\* Two phones (Ana's first phone and her new one), one tab each; Auth makes up to 2 users (so no new user after a sign-out: TwoTabs covers that);
\* up to 2 claims of their own; a third member, Bo, so the account can hold one name while the
\* phone carries another. Nobody picks a name on the phone while its sign-in code is checked
\* (TwoTabs covers that). Covers signing in on another phone and two phones claiming members.
CONSTANTS
  Phones = {p1, p2}
  TwoTabs = FALSE
  ClaimDuringSignIn = FALSE
  MaxUser = 2
  MaxOps = 2
  Members = {"ana", "bo", "ben"}
  Broken = "none"
SPECIFICATION Spec
CONSTRAINT OpBound
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
  TypeOK
  SentAsShown
  KeepsGroups
  GroupsComeBack
  OneHolderPerMember
  LinkKeepsWorking
  NoOrphanedMember
  OneAnonymousUserPerPhone
  CarryKeepsAccountName
