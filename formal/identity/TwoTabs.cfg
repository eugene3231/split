\* One phone with two tabs: the home tab (account sheet open) and the group tab (invite link,
\* group screen). Auth makes up to 3 users; up to 2 claims of their own. The group tab can pick
\* a name while the home tab checks a sign-in code. Covers the cross-tab adopt.
CONSTANTS
  Phones = {p1}
  TwoTabs = TRUE
  ClaimDuringSignIn = TRUE
  MaxUser = 3
  MaxOps = 2
  Members = {"ana", "ben"}
  Broken = "none"
SPECIFICATION Spec
CONSTRAINT OpBound
CHECK_DEADLOCK FALSE
INVARIANTS
  TypeOK
  SentAsShown
  KeepsGroups
  GroupsComeBack
  OneHolderPerMember
  LinkKeepsWorking
  NoOrphanedMember
  OneAnonymousUserPerPhone
  CarryKeepsAccountName
