name: image

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: GIT_SHA=${{ env.SHA }}
          load: true
          tags: split-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image as the NAS compose does and wait for healthy
        run: |
          data="$RUNNER_TEMP/data"
          sudo install -d -o 1001 -g 10 "$data"
          docker run -d --name split-api --read-only --tmpfs /tmp --user 1001:10 --cap-drop ALL \
            --security-opt no-new-privileges -v "$data:/data" -p 8080:8080 \
            -e GEMINI_API_KEY=ci -e TURNSTILE_SECRET=1x0000000000000000000000000000000AA split-api:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' split-api)
            if [ "$status" = healthy ]; then
              docker logs split-api | grep -F '{"msg":"listening","port":8080}'
              curl -fsS http://127.0.0.1:8080/api/v1/health | grep -F '"migrations":1'
              exit 0
            fi
            sleep 1
          done
          docker logs split-api
          exit 1
      - name: Say what to chown when /data is not writable
        run: |
          data="$RUNNER_TEMP/root-data"
          sudo install -d -o 0 -g 0 -m 0755 "$data"
          if out=$(docker run --rm --read-only --user 1001:10 --cap-drop ALL --security-opt no-new-privileges \
            -e GEMINI_API_KEY=ci -e TURNSTILE_SECRET=ci -v "$data:/data" split-api:ci 2>&1); then
            echo "container started on a root-owned /data" >&2
            exit 1
          fi
          echo "$out"
          grep -F '/data is not writable by uid 1001 gid 10: chown 1001:10 the data folder' <<<"$out"
